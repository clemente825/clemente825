<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Imágenes en HTML</title>
</head>
<body>

  <h1>Trabajando con Imágenes</h1>

  <h2>1. Imagen básica con texto alternativo</h2>
  <img src="imagenes/images.jpg" alt="Fotografía de ejemplo aleatoria">

  <h2>2. Definir dimensiones HTML (Ancho y Alto)</h2>
  <p>Es buena práctica indicar <code>width</code> y <code>height</code> para evitar saltos en la carga:</p>
  <img src="https://picsum.photos/200/80" alt="Logo de ejemplo" width="200" height="80">

</body>
</html>
