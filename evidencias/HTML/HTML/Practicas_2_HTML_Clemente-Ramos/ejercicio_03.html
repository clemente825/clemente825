<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Matriz Financiera</title>
</head>
<body>
    <h1>Matriz Financiera Consolidada</h1>

    <table border="1">
        <tr>
            <th rowspan="2">Departamento</th>
            <th colspan="3">Resultados financieros</th>
        </tr>
        <tr>
            <th>Ingresos</th>
            <th>Gastos</th>
            <th>Balance</th>
        </tr>
        <tr>
            <td>Producción</td>
            <td>500000 €</td>
            <td>300000 €</td>
            <td>200000 €</td>
        </tr>
        <tr>
            <td>Marketing</td>
            <td>250000 €</td>
            <td>150000 €</td>
            <td>100000 €</td>
        </tr>
        <tr>
            <td>Administración</td>
            <td>180000 €</td>
            <td>120000 €</td>
            <td>60000 €</td>
        </tr>
    </table>
</body>
</html>
